<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" role="img" aria-labelledby="t-lk">
  <title id="t-lk">Opsi 3: The Squircle App Icon (Format Ikon Aplikasi)</title>
  <defs>
    <style>
