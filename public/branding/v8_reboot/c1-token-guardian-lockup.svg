  <ellipse cx="94" cy="114" rx="8" ry="10" fill="#FFFFFF" />
  <circle cx="94" cy="115" r="5" fill="#0F172A" />
  <circle cx="92" cy="113" r="1.8" fill="#FFFFFF" />

