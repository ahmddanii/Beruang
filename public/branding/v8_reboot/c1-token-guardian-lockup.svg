  <circle cx="190" cy="72" r="28" fill="#0052B3" />
  <circle cx="190" cy="72" r="18" fill="#0066D6" />
  <circle cx="190" cy="72" r="8" fill="#FFFFFF" opacity="0.9" />

  <!-- Main Bear Head (Vibrant Trust Blue #0066D6) -->
  <path
    fill="#0066D6"
    d="
      M 92 68
