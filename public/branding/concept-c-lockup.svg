  <!-- Left Ear -->
  <circle cx="76" cy="64" r="26" fill="#0081A0" />
  <!-- Right Ear -->
  <circle cx="180" cy="64" r="26" fill="#0081A0" />

  <!-- Shield Base with exact 60° (dx=30, dy=52) and 120° angles -->
  <path
