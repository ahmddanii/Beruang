        fill: #00AA13;
        letter-spacing: 2px;
      }
    </style>
  </defs>
  <g transform="translate(24, 25) scale(0.5078)">
    
  <title id="t-c1">Beruang - The Token Guardian</title>
  
  <!-- Left Dynamic Coin Ear -->
