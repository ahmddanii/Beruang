<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Navbar Ergonomic Scale Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #F3F8FC;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .card-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sec-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748B;
    }

    .navbar-card {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 14px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
    }

    .navbar-card.dark {
      background: rgba(19, 22, 31, 0.98);
      border-color: rgba(39, 39, 42, 0.85);
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    /* Ergonomic Logo Height: 28px (h-7) */
    .logo-img {
      height: 28px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-text {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1;
    }

    .ber {
      color: #0081A0;
    }

    .dark .ber {
      color: #00A5CC;
    }

    .uang {
      color: #00AA13;
    }

    .dark .uang {
      color: #22C55E;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
    }

    .dark .nav-links {
      color: #94A3B8;
    }

    .cta-btn {
      background: #0081A0;
      color: #FFF;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
    }

    .right-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .noti-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #FFF;
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .dark .noti-btn {
      background: #18191E;
      border-color: #2E2F38;
      color: #FFF;
    }

    .avatar-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #E2E8F0;
      background: #E0F2FE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #0081A0;
    }
  </style>
</head>
<body>
  <!-- Public Navbar Light -->
  <div class="card-wrap">
    <div class="sec-label">1. Navbar Publik / Beranda (Light Mode — Logo 28px / h-7)</div>
    <div class="navbar-card">
      <a href="#" class="brand-link">
        <img src="file:///F:/Percobaan Lomba/INSEVENT FULLSTACK/App/public/logo/logoSmall.svg" class="logo-img" alt="Logo" />
        <span class="brand-text">
          <span class="ber">Ber</span><span class="uang">uang</span>
        </span>
      </a>
      <div class="nav-links">
        <span>Untuk UMKM</span>
        <span>Untuk Investor</span>
        <span>Katalog Terkurasi</span>
        <span>Tentang Kami</span>
      </div>
      <a href="#" class="cta-btn">Mulai Sekarang</a>
    </div>
  </div>

  <!-- Dashboard Top Bar Light -->
  <div class="card-wrap">
    <div class="sec-label">2. Top Bar Dashboard UMKM (Light Mode — Logo 28px / h-7)</div>
    <div class="navbar-card">
      <a href="#" class="brand-link">
        <img src="file:///F:/Percobaan Lomba/INSEVENT FULLSTACK/App/public/logo/logoSmall.svg" class="logo-img" alt="Logo" />
        <span class="brand-text">
          <span class="ber">Ber</span><span class="uang">uang</span>
        </span>
      </a>
      <div class="right-tools">
        <div class="noti-btn">🔔</div>
        <div class="avatar-btn">FS</div>
      </div>
    </div>
  </div>

  <!-- Dashboard Top Bar Dark -->
  <div class="card-wrap">
    <div class="sec-label">3. Top Bar Dashboard UMKM (Dark Mode — Logo 28px / h-7)</div>
    <div class="navbar-card dark">
      <a href="#" class="brand-link">
        <img src="file:///F:/Percobaan Lomba/INSEVENT FULLSTACK/App/public/logo/logoSmall.svg" class="logo-img" alt="Logo" />
        <span class="brand-text">
          <span class="ber">Ber</span><span class="uang">uang</span>
        </span>
      </a>
      <div class="right-tools">
        <div class="noti-btn">🔔</div>
        <div class="avatar-btn">FS</div>
      </div>
    </div>
  </div>
</body>
</html>
