<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-c2">
  <title id="title-c2">Beruang - Bear-Eared Cloud Hat</title>
  <defs>
