    <!-- Inner Ear indentations on White Cloud Hat -->
    <circle cx="94" cy="74" r="8" fill="#E5E7EB" />
    <circle cx="162" cy="74" r="8" fill="#E5E7EB" />

    <!-- Iconic Thick Peaceful Closed Eyes -->
    <path
      fill="none"
